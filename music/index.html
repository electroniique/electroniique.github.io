<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music — Equidist Neon</title><link rel="stylesheet" href="../css/style.css"></head><body><header><h1><a href="../">Equidist Neon</a></h1><nav><a href="./">Ratings</a><a href="reviews.html">Reviews</a><a href="projects.html">Projects</a><a href="https://drive.google.com/file/d/1RD_7KyYvKANHp7fiAQ30x9O_OGrXJr8o/view?usp=sharing" target="_blank" rel="noopener noreferrer">Rating Calculator</a><a href="../film/">영화</a><a href="../photography/">사진</a><a href="../academics/">학문</a><a href="../links/">링크</a><a href="../">Home</a></nav></header><main><h2>Music / Ratings</h2><p class="muted" id="count"></p><div class="controls"><input id="q" placeholder="Artist or release"><select id="sort"><option value="rating-desc">Rating ↓</option><option value="rating-asc">Rating ↑</option><option value="artist">Artist</option><option value="year-desc">Year ↓</option><option value="year-asc">Year ↑</option></select></div><table><thead><tr><th class="artist">Artist</th><th>Release</th><th class="year">Year</th><th class="score">Rating</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="prev">← Prev</button><span id="page"></span><button id="next">Next →</button></div></main><script>
let data=[],page=1;const per=50;const $=x=>document.getElementById(x);fetch('../data/music.json').then(r=>r.json()).then(x=>{data=x;render()});function filtered(){let q=$('q').value.trim().toLowerCase();let a=data.filter(x=>!q||(x.artist+' '+x.title).toLowerCase().includes(q));let s=$('sort').value;if(s==='rating-desc')a.sort((x,y)=>(y.rating??-Infinity)-(x.rating??-Infinity));if(s==='rating-asc')a.sort((x,y)=>(x.rating??Infinity)-(y.rating??Infinity));if(s==='artist')a.sort((x,y)=>x.artist.localeCompare(y.artist));if(s==='year-desc')a.sort((x,y)=>(y.year??-Infinity)-(x.year??-Infinity));if(s==='year-asc')a.sort((x,y)=>(x.year??Infinity)-(y.year??Infinity));return a}function render(){let a=filtered(),pages=Math.max(1,Math.ceil(a.length/per));page=Math.min(page,pages);let part=a.slice((page-1)*per,page*per);$('rows').innerHTML=part.map(x=>`<tr><td class="artist">${esc(x.artist)}</td><td>${esc(x.title)}</td><td>${x.year??''}</td><td class="score">${stars(x.rating)}</td></tr>`).join('');$('count').textContent=`${a.length.toLocaleString()} records`;$('page').textContent=`${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}function stars(r){if(r==null||Number(r)===0)return '';let v=Math.max(0,Math.min(10,Number(r)));let full=Math.floor(v/2),half=(v%2)>=1;return '★'.repeat(full)+(half?'½':'')}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}$('q').oninput=()=>{page=1;render()};$('sort').onchange=()=>{page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
</script></body></html>
