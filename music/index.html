<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music — Equidist Neon /// Ploique Cyx</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="lang-gate" id="langGate"><div class="lang-box"><h1>Language / 언어</h1><div class="lang-options"><button onclick="chooseLanguage('ko')">한국어</button><button onclick="chooseLanguage('en')">English</button></div></div></div><div class="shell"><header class="site-header"><div class="brand-row"><a class="brand" href=".././">Equidist Neon /// Ploique Cyx</a><div class="assisted">assisted by GPT&nbsp;&nbsp;—</div></div><nav class="nav"><a class="" href=".././" data-en="Home" data-ko="홈">Home</a><a class="active" href="../music/" data-en="Music" data-ko="음악">Music</a><a class="" href="../film/" data-en="Film" data-ko="영화">Film</a><a class="" href="../essays/" data-en="Essays" data-ko="에세이">Essays</a><div class="dropdown"><button class="dropbtn"><span data-en="Academia" data-ko="학문">Academia</span>&nbsp;⌄</button><div class="dropmenu">

<a class="" href="../links/" data-en="Links" data-ko="링크">Links</a></nav><div class="subnav"><a href="../music/" data-en="Ratings" data-ko="평점">Ratings</a><a href="../music/reviews.html" data-en="Reviews" data-ko="리뷰">Reviews</a><a href="../music/projects.html" data-en="Projects" data-ko="프로젝트">Projects</a><a href="https://drive.google.com/file/d/1RD_7KyYvKANHp7fiAQ30x9O_OGrXJr8o/view?usp=sharing" target="_blank" rel="noopener" data-en="Rating Calculator" data-ko="평점 계산기">Rating Calculator</a></div></header><main><h2 data-en="Music / Ratings" data-ko="음악 / 평점">Music / Ratings</h2><p class="muted" id="count"></p><div class="controls"><input id="q" placeholder="Artist or release"><select id="sort"><option value="rating-desc">Rating ↓</option><option value="rating-asc">Rating ↑</option><option value="artist">Artist</option><option value="year-desc">Year ↓</option><option value="year-asc">Year ↑</option></select></div><table><thead><tr><th>Artist</th><th>Release</th><th>Year</th><th class="score">Rating</th></tr></thead><tbody id="rows"></tbody></table><div class="pager"><button id="prev">← Prev</button><span id="page"></span><button id="next">Next →</button></div></main><footer><span>Equidist Neon /// Ploique Cyx</span><span>2026 — ∞ &nbsp;<button class="lang-reset" onclick="resetLanguage()" data-en="LANG" data-ko="언어">LANG</button></span></footer></div><script>
let data=[],page=1;const per=50,$=x=>document.getElementById(x);
fetch('../data/music.json').then(r=>r.json()).then(x=>{data=x;render()});
function filtered(){let q=$('q').value.trim().toLowerCase(),a=data.filter(x=>!q||(x.artist+' '+x.title).toLowerCase().includes(q)),s=$('sort').value;if(s==='rating-desc')a.sort((x,y)=>(y.rating??-Infinity)-(x.rating??-Infinity));if(s==='rating-asc')a.sort((x,y)=>(x.rating??Infinity)-(y.rating??Infinity));if(s==='artist')a.sort((x,y)=>x.artist.localeCompare(y.artist));if(s==='year-desc')a.sort((x,y)=>(y.year??-Infinity)-(x.year??-Infinity));if(s==='year-asc')a.sort((x,y)=>(x.year??Infinity)-(y.year??Infinity));return a}
function stars(r){if(r==null||Number(r)===0)return '';let v=Math.max(0,Math.min(10,Number(r))),full=Math.floor(v/2),half=(v%2)>=1;return '★'.repeat(full)+(half?'½':'')}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){let a=filtered(),pages=Math.max(1,Math.ceil(a.length/per));page=Math.min(page,pages);$('rows').innerHTML=a.slice((page-1)*per,page*per).map(x=>`<tr><td>${esc(x.artist)}</td><td>${esc(x.title)}</td><td>${x.year??''}</td><td class="score">${stars(x.rating)}</td></tr>`).join('');$('count').textContent=`${a.length.toLocaleString()} records`;$('page').textContent=`${page} / ${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages}
$('q').oninput=()=>{page=1;render()};$('sort').onchange=()=>{page=1;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
</script><script>
function applyLanguage(lang){document.documentElement.lang=lang;document.querySelectorAll('[data-en][data-ko]').forEach(el=>el.innerHTML=el.dataset[lang]);document.querySelectorAll('[data-ph-en][data-ph-ko]').forEach(el=>el.placeholder=el.dataset['ph'+(lang==='ko'?'Ko':'En')]);}
function chooseLanguage(lang){localStorage.setItem('equidist-language',lang);applyLanguage(lang);document.getElementById('langGate').style.display='none'}
function resetLanguage(){localStorage.removeItem('equidist-language');document.getElementById('langGate').style.display='flex'}
const saved=localStorage.getItem('equidist-language');if(saved==='ko'||saved==='en'){applyLanguage(saved);document.getElementById('langGate').style.display='none'}
</script></body></html>
