<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film — Equidist Neon</title><link rel="stylesheet" href="../css/style.css"></head><body><header><h1><a href="../">Equidist Neon</a></h1><nav><a href="../music/">음악</a><a href="./">영화</a><a href="../photography/">사진</a><a href="../academics/">학문</a><a href="../links/">링크</a><a href="../">Home</a></nav></header><main><h2>Film / Ratings</h2><p class="muted" id="count"></p><div class="controls"><input id="q" placeholder="Film title"><select id="sort"><option value="rating-desc">Rating ↓</option><option value="rating-asc">Rating ↑</option><option value="title">Title</option><option value="year-desc">Year ↓</option><option value="year-asc">Year ↑</option><option value="catalog-desc">Catalog date ↓</option></select></div><table><thead><tr><th>Title</th><th class="year">Year</th><th class="date">Cataloged</th><th class="score">Rating</th></tr></thead><tbody id="rows"></tbody></table></main><script>
let data=[];const $=x=>document.getElementById(x);fetch('../data/film.json').then(r=>r.json()).then(x=>{data=x;render()});function stars(r){if(r==null||Number(r)===0)return '';let v=Math.max(0,Math.min(10,Number(r)));let full=Math.floor(v/2),half=(v%2)>=1;return '★'.repeat(full)+(half?'½':'')}function year(d){return d?d.slice(0,4):''}function filtered(){let q=$('q').value.trim().toLowerCase();let a=data.filter(x=>!q||x.title.toLowerCase().includes(q));let s=$('sort').value;if(s==='rating-desc')a.sort((x,y)=>(y.rating??-Infinity)-(x.rating??-Infinity));if(s==='rating-asc')a.sort((x,y)=>(x.rating??Infinity)-(y.rating??Infinity));if(s==='title')a.sort((x,y)=>x.title.localeCompare(y.title));if(s==='year-desc')a.sort((x,y)=>year(y.release_date)-year(x.release_date));if(s==='year-asc')a.sort((x,y)=>year(x.release_date)-year(y.release_date));if(s==='catalog-desc')a.sort((x,y)=>y.catalog_date.localeCompare(x.catalog_date));return a}function render(){let a=filtered();$('rows').innerHTML=a.map(x=>`<tr><td>${esc(x.title)}</td><td>${year(x.release_date)}</td><td>${esc(x.catalog_date)}</td><td class="score">${stars(x.rating)}</td></tr>`).join('');$('count').textContent=`${a.length.toLocaleString()} films`;}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}$('q').oninput=render;$('sort').onchange=render;
</script></body></html>
