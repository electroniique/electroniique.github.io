<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film — Equidist Neon /// Ploique Cyx</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="lang-gate" id="langGate"><div class="lang-box"><h1>Language / 언어</h1><div class="lang-options"><button onclick="chooseLanguage('ko')">한국어</button><button onclick="chooseLanguage('en')">English</button></div></div></div><div class="shell"><header class="site-header"><div class="brand-row"><a class="brand" href=".././">Equidist Neon /// Ploique Cyx</a><div class="assisted">assisted by GPT&nbsp;&nbsp;—</div></div><nav class="nav"><a class="" href=".././" data-en="Home" data-ko="홈">Home</a><a class="" href="../music/" data-en="Music" data-ko="음악">Music</a><a class="active" href="../film/" data-en="Film" data-ko="영화">Film</a><a class="" href="../photography/" data-en="Photography" data-ko="사진">Photography</a><div class="dropdown"><button class="dropbtn"><span data-en="Academia" data-ko="학문">Academia</span>&nbsp;⌄</button><div class="dropmenu">
<a href="../academics/physics/" data-en="Physics" data-ko="물리학">Physics</a>

<a class="" href="../links/" data-en="Links" data-ko="링크">Links</a></nav></header><main><h2 data-en="Film / Ratings" data-ko="영화 / 평점">Film / Ratings</h2><p class="muted" id="count"></p><div class="controls"><input id="q" placeholder="Film title"><select id="sort"><option value="rating-desc">Rating ↓</option><option value="rating-asc">Rating ↑</option><option value="title">Title</option><option value="year-desc">Year ↓</option><option value="year-asc">Year ↑</option><option value="catalog-desc">Catalog date ↓</option></select></div><table><thead><tr><th>Title</th><th>Year</th><th class="date">Cataloged</th><th class="score">Rating</th></tr></thead><tbody id="rows"></tbody></table></main><footer><span>Equidist Neon /// Ploique Cyx</span><span>2026 — ∞ &nbsp;<button class="lang-reset" onclick="resetLanguage()" data-en="LANG" data-ko="언어">LANG</button></span></footer></div><script>
let data=[];const $=x=>document.getElementById(x);fetch('../data/film.json').then(r=>r.json()).then(x=>{data=x;render()});function stars(r){if(r==null||Number(r)===0)return '';let v=Math.max(0,Math.min(10,Number(r)));let full=Math.floor(v/2),half=(v%2)>=1;return '★'.repeat(full)+(half?'½':'')}function year(d){return d?d.slice(0,4):''}function filtered(){let q=$('q').value.trim().toLowerCase();let a=data.filter(x=>!q||x.title.toLowerCase().includes(q));let s=$('sort').value;if(s==='rating-desc')a.sort((x,y)=>(y.rating??-Infinity)-(x.rating??-Infinity));if(s==='rating-asc')a.sort((x,y)=>(x.rating??Infinity)-(y.rating??Infinity));if(s==='title')a.sort((x,y)=>x.title.localeCompare(y.title));if(s==='year-desc')a.sort((x,y)=>year(y.release_date)-year(x.release_date));if(s==='year-asc')a.sort((x,y)=>year(x.release_date)-year(y.release_date));if(s==='catalog-desc')a.sort((x,y)=>y.catalog_date.localeCompare(x.catalog_date));return a}function render(){let a=filtered();$('rows').innerHTML=a.map(x=>`<tr><td>${esc(x.title)}</td><td>${year(x.release_date)}</td><td>${esc(x.catalog_date)}</td><td class="score">${stars(x.rating)}</td></tr>`).join('');$('count').textContent=`${a.length.toLocaleString()} films`;}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}$('q').oninput=render;$('sort').onchange=render;
</script><script>
function applyLanguage(lang){document.documentElement.lang=lang;document.querySelectorAll('[data-en][data-ko]').forEach(el=>el.innerHTML=el.dataset[lang]);document.querySelectorAll('[data-ph-en][data-ph-ko]').forEach(el=>el.placeholder=el.dataset['ph'+(lang==='ko'?'Ko':'En')]);}
function chooseLanguage(lang){localStorage.setItem('equidist-language',lang);applyLanguage(lang);document.getElementById('langGate').style.display='none'}
function resetLanguage(){localStorage.removeItem('equidist-language');document.getElementById('langGate').style.display='flex'}
const saved=localStorage.getItem('equidist-language');if(saved==='ko'||saved==='en'){applyLanguage(saved);document.getElementById('langGate').style.display='none'}
</script></body></html>
