<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505">
<title>Equidist Neon /// Ploique Cyx</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="background" aria-hidden="true"></div><div class="glitch-filter" aria-hidden="true"></div>
<main>
<section id="homeView" class="view home-view active" aria-label="Home">
  <div class="site-shell">
    <nav class="mondrian" aria-label="Home sections">
      <span class="tile blank b1"></span><span class="tile blank b2"></span><span class="tile dark b3"></span><span class="tile blank b4"></span><span class="tile dark b5"></span><span class="tile blank b6"></span>
      <button class="tile zone physics" data-page="physics" data-color="#e32222"><span>PHYSICS</span></button>
      <button class="tile zone mathematics" data-page="mathematics" data-color="#e0b51f"><span>MATHEMATICS</span></button>
      <button class="tile zone music" data-page="music" data-color="#22a447"><span>MUSIC</span></button>
      <button class="tile zone film" data-page="film" data-color="#1456b8"><span>FILM</span></button>
      <button class="tile zone essay" data-page="essay" data-color="#7b32b5"><span>ESSAY</span></button>
    </nav>
    <section class="stage" aria-label="Interactive rotating cube">
      <button class="home-object" type="button" aria-label="Home object">
        <span class="scene"><span class="cube">
          <span class="face front"></span><span class="face back"></span><span class="face right"></span><span class="face left"></span><span class="face top"></span><span class="face bottom"></span>
          <span class="terrain" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </span></span>
      </button>
      <div class="status"><span class="status-dot"></span><span>HOME / IDLE</span></div>
    </section>
  </div>
</section>

<section id="pageView" class="view content-view" aria-live="polite">
  <header class="legacy-header">
    <button class="brand-home" type="button" data-page="home" aria-label="Home">≅ℕε</button>
    <nav class="legacy-tabs" aria-label="Main navigation">
      <button data-page="home">HOME</button><button data-page="music">MUSIC</button><button data-page="film">FILM</button><button data-page="physics">PHYSICS</button><button data-page="essay">ESSAY</button><button data-page="mathematics">MATHEMATICS</button>
    </nav>
  </header>
  <article class="page-panel">
    <p class="page-index" id="pageIndex">04 / SECTION</p>
    <h1 id="pageTitle">PHYSICS</h1>
    <div class="title-rule"></div>
    <div id="pageBody" class="page-body"></div>
  </article>
</section>
</main>
<script src="script.js"></script>
</body></html>
