<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Equidist Neon /// Ploique Cyx</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <main class="site-shell">
    <nav class="mondrian" aria-label="Sections">
      <img src="assets/navigation.webp" alt="" class="mondrian-art" />
      <a class="zone physics" data-section="Physics" data-color="#e32222" href="#physics"><span>PHYSICS</span></a>
      <a class="zone mathematics" data-section="Mathematics" data-color="#e0b51f" href="#mathematics"><span>MATHEMATICS</span></a>
      <a class="zone music" data-section="Music" data-color="#22a447" href="#music"><span>MUSIC</span></a>
      <a class="zone film" data-section="Film" data-color="#1456b8" href="#film"><span>FILM</span></a>
      <a class="zone essay" data-section="Essay" data-color="#7b32b5" href="#essay"><span>ESSAY</span></a>
    </nav>

    <section class="stage" aria-label="Interactive home object">
      <div class="hud hud-top">EQUI / PLQ — INDEX 001</div>
      <button class="home-object" type="button" aria-label="Return home">
        <span class="scene">
          <span class="rotator">
            <span class="cube-image"></span>
            <span class="edge edge-a"></span><span class="edge edge-b"></span>
            <span class="edge edge-c"></span><span class="edge edge-d"></span>
          </span>
        </span>
      </button>
      <div class="status" aria-live="polite"><span class="status-dot"></span><span id="statusText">HOME / IDLE</span></div>
      <div class="hud hud-bottom">CLICK CUBE → HOME · SELECT LEFT FIELD → SECTION</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
